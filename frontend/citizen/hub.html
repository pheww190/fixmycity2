<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Knowledge Hub — FixMyCity</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    .hub-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .grid-hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .article-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; display: flex; flex-direction: column; }
    .article-title { font-size: 1.2rem; font-weight: bold; color: var(--text-primary); margin-bottom: 0.5rem; }
    .article-category { display: inline-block; background: rgba(59, 130, 246, 0.1); color: var(--accent); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; margin-bottom: 1rem; align-self: flex-start; }
    .article-desc { color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.5rem; flex-grow: 1; }
    .read-more { color: var(--accent); text-decoration: none; font-weight: 500; }
    .read-more:hover { text-decoration: underline; }
    .search-box { width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 2rem; font-size: 1rem; background: var(--bg-secondary); color: var(--text-primary); }
  </style>
  <script src="/shared/auth.js"></script>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/citizen/portal" class="nav-brand">
<span class="nav-icon">
  <img src="/pho/logo.jpeg" alt="FixMyCity Logo" style="width:40px;height:40px;object-fit:contain;">
</span>        <span><span>FixMyCity</span></span>
      </a>
      <div class="nav-links">
        <a href="/citizen/portal">File Complaint</a>
        <a href="/citizen/my-complaints">My History</a>
        <a href="/citizen/feed">Neighborhood Feed</a>
        <a href="/citizen/hub" class="active">Civic Hub</a>
        <a href="/citizen/funding">Community Funding</a>
        <a href="/citizen/polls">Polls</a>
        <a href="/citizen/login" onclick="Auth.logout('/citizen/login', event)">Logout</a>
      </div>
    </div>
  </nav>

  <div class="hub-container">
    <button onclick="window.location.href='/citizen/portal'" class="btn btn-ghost" style="margin-bottom: 1rem; padding: 0.5rem 0;">&larr; Back to Portal</button>
    <div class="mb-3">
      <h1>Civic Knowledge Hub</h1>
      <p class="text-secondary">Learn about your municipal rights, government schemes, and urban policies.</p>
    </div>

    <input type="text" class="search-box" id="hubSearch" placeholder="Search articles, guides, policies..." onkeyup="filterHub()">
    <div class="grid-hub" id="hubGrid"></div>
  </div>

    <script>
    Auth.requireAuth("citizen");
    
    async function loadHub() {
      try {
        const res = await fetch("/api/features/hub", { headers: Auth.getAuthHeaders() });
        const data = await res.json();
        renderHub(data.articles || []);
      } catch (err) {
        document.getElementById('hubGrid').innerHTML = '<div class="text-center p-3 text-secondary">Error loading hub articles.</div>';
      }
    }

    function renderHub(articles) {
      const hubGrid = document.getElementById('hubGrid');
      hubGrid.innerHTML = '';
      if (articles.length === 0) {
        hubGrid.innerHTML = '<div class="text-center p-3 text-secondary">No articles published yet.</div>';
        return;
      }

      articles.forEach(article => {
        const div = document.createElement('div');
        div.className = 'article-card';
        div.innerHTML = `
          <span class="article-category">${article.category}</span>
          <h3 class="article-title">${article.title}</h3>
          <p class="article-desc">${article.description}</p>
          <div class="article-content" style="display:none; margin-bottom:1rem; color:var(--text-secondary);">${article.content}</div>
          <a href="#" class="read-more" onclick="toggleReadMore(this, event)">Read Article &rarr;</a>
        `;
        hubGrid.appendChild(div);
      });
    }

    function toggleReadMore(btn, event) {
      event.preventDefault();
      const content = btn.previousElementSibling;
      if (content.style.display === 'none') {
        content.style.display = 'block';
        btn.textContent = 'Show Less \u2191';
      } else {
        content.style.display = 'none';
        btn.textContent = 'Read Article \u2192';
      }
    }

    function filterHub() {
      const input = document.getElementById('hubSearch').value.toLowerCase();
      const cards = document.getElementsByClassName('article-card');
      
      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.article-title').textContent.toLowerCase();
        const desc = cards[i].querySelector('.article-desc').textContent.toLowerCase();
        const category = cards[i].querySelector('.article-category').textContent.toLowerCase();
        
        if (title.includes(input) || desc.includes(input) || category.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadHub);
  </script>
</body>
</html>
